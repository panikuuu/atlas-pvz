services:
  atlas:
    build: .
    ports:
      - "127.0.0.1:${ATLAS_PORT:-8080}:8080"
    volumes:
      - atlas-data:/var/lib/atlas
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  atlas-data:
