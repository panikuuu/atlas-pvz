name: Atlas checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: node tests/test_map.cjs
      - name: Start the Docker deployment
        run: docker compose up --build -d --wait --wait-timeout 90
      - name: Check the published service and run six isolated cases
        run: |
          curl --fail http://127.0.0.1:8080/health/ready
          docker compose exec -T atlas python - --app /srv/atlas < tests/test_cases.py
          docker compose exec -T atlas sh -c 'cat > /tmp/test_cases.py' < tests/test_cases.py
          docker compose exec -T -e PYTHONPATH=/tmp atlas python - --app /srv/atlas < tests/test_truck_runs.py
          docker compose exec -T -e PYTHONPATH=/tmp atlas python - --app /srv/atlas < tests/test_fleet.py
          docker compose exec -T -e PYTHONPATH=/tmp atlas python - --app /srv/atlas < tests/test_unified_demo.py
      - name: Check demand, geography and stock placement
        run: |
          docker compose run --rm -T -v "$PWD/tests:/srv/tests:ro" atlas sh -ec '
            mkdir -p /tmp/check
            ln -s /srv/atlas /tmp/check/app
            cp -R /srv/tests /tmp/check/tests
            cd /tmp/check
            python tests/test_demand.py
            python tests/test_geography.py
            python tests/test_stock_placement.py
          '
      - if: always()
        run: docker compose logs && docker compose down
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.1'
          architecture: x64
      - run: python -m pip install PyInstaller==6.22.3
      - name: Package and launch the portable executable
        run: |
          python scripts/build_windows.py
          python tests/test_cases.py --exe dist/Atlas-PVZ.exe
          python tests/test_truck_runs.py --exe dist/Atlas-PVZ.exe
          python tests/test_fleet.py --exe dist/Atlas-PVZ.exe
          python tests/test_unified_demo.py --exe dist/Atlas-PVZ.exe
          python tests/test_demand.py
          python tests/test_geography.py
          python tests/test_stock_placement.py
          python tests/test_desktop.py --exe dist/Atlas-PVZ.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-PVZ-Windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
